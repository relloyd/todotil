version: "3"

vars:
  BINARY: todotil
  BIN_DIR: bin
  # Run golangci-lint through `go run` so it is built with this module's Go
  # toolchain; a linter built with an older Go refuses a newer go.mod.
  GOLANGCI_LINT: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
  # Bump deliberately; see https://pkg.go.dev/golang.org/x/vuln/cmd/govulncheck?tab=versions
  GOVULNCHECK_VERSION: v1.9.0

tasks:
  default:
    desc: Format, vet, lint, test and build
    cmds:
      - task: check
      - task: build

  fmt:
    desc: Format all Go code in place
    cmds:
      - gofmt -w .

  fmt-check:
    desc: Fail if any Go files need gofmt (reports only; does not rewrite files)
    aliases: [fmt:check]
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt (run task fmt):"
          echo "$unformatted"
          exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (extra flags after --, e.g. task lint -- --new-from-merge-base=origin/main)
    cmds:
      - "{{.GOLANGCI_LINT}} run {{.CLI_ARGS}} ./..."

  test:
    desc: Run unit tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  test:short:
    desc: Run unit tests quickly (cached, no race detector)
    cmds:
      - go test ./...

  cover:
    desc: Run tests and report coverage per package
    cmds:
      - go test -cover ./...

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  check:
    desc: Format, then vet, lint and test (local workflow)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  tidy-check:
    desc: Fail if go.mod/go.sum are not tidy
    cmds:
      - go mod tidy -diff

  vuln:
    desc: Report known vulnerabilities (Go vulndb) reachable from this module's code, including the Go standard library
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  ci:
    desc: Non-mutating checks for CI (gofmt, vet, go.mod tidiness, govulncheck, race-enabled tests)
    cmds:
      - task: fmt-check
      - task: vet
      - task: tidy-check
      - task: vuln
      - go test ./... -count=1 -race

  build:
    desc: Build the binary into ./bin
    cmds:
      - go build -trimpath -o {{.BIN_DIR}}/{{.BINARY}} .
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN_DIR}}/{{.BINARY}}"

  install:
    desc: Check everything, then install todotil into $GOBIN (or $GOPATH/bin)
    cmds:
      - task: check
      - go install -trimpath .
      - |
        bin="$(go env GOBIN)"; [ -n "$bin" ] || bin="$(go env GOPATH)/bin"
        echo "Installed $bin/{{.BINARY}}"

  run:
    desc: Run against a throwaway home directory (never touches ~/.config/todotil)
    cmds:
      - mkdir -p tmp/home
      - go run . --home tmp/home

  clean:
    desc: Remove build output and the throwaway run home
    cmds:
      - rm -rf {{.BIN_DIR}} tmp
